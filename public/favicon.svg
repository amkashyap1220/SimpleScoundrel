<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon: two storybook cards fanned on a dungeon-stone background, with a sword across them -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#4a3f6e"/>
      <stop offset="1" stop-color="#1c1828"/>
    </radialGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V10" stroke="rgb(43 29 18 / 0.08)" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- stone blocks -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4">
    <path d="M0 96H512M0 208H512M0 320H512M0 432H512M120 0V96M330 96V208M90 208V320M400 208V320M200 320V432M60 432V512M380 432V512M260 0V96"/>
  </g>
  <g stroke="#2b1d12" stroke-linejoin="round" stroke-linecap="round">
    <!-- sword behind the cards: hilt at the lower left, point at the upper right -->
    <g transform="translate(-14 14) rotate(45 256 260)">
      <path d="M242 350V52L256 22 270 52V350Z" fill="#d9dde0" stroke-width="7"/>
      <path d="M256 60V340" stroke-width="4" fill="none"/>
      <rect x="196" y="348" width="120" height="26" rx="11" fill="#e3b23c" stroke-width="7"/>
      <rect x="243" y="374" width="26" height="60" rx="6" fill="#8a5a32" stroke-width="7"/>
      <circle cx="256" cy="448" r="20" fill="#e3b23c" stroke-width="7"/>
      <circle cx="256" cy="361" r="7" fill="#b8372b" stroke-width="4"/>
    </g>
    <g transform="translate(24 -8) translate(256 256) scale(0.88) translate(-256 -256)">
    <!-- back card: clubs -->
    <g transform="rotate(-13 221 246)">
      <rect x="126" y="112" width="190" height="268" rx="18" fill="#f3e7cb" stroke-width="7"/>
      <rect x="141" y="127" width="160" height="238" rx="9" fill="#a9c8a0" stroke-width="5"/>
      <rect x="141" y="127" width="160" height="238" rx="9" fill="url(#hatch)" stroke="none"/>
      <path transform="translate(208 246) scale(3.4)" fill="#2f7a3c" stroke-width="1.5" d="M0-12.5A5.6 5.6 0 0 1 4.6-3.7 5.6 5.6 0 1 1 1.7 5.9C2.1 8.6 3.3 10.6 5 12H-5C-3.3 10.6-2.1 8.6-1.7 5.9A5.6 5.6 0 1 1-4.6-3.7 5.6 5.6 0 0 1 0-12.5Z"/>
    </g>
    <!-- front card: spades -->
    <g transform="rotate(9 297 256)">
      <rect x="202" y="122" width="190" height="268" rx="18" fill="#f3e7cb" stroke-width="7"/>
      <rect x="217" y="137" width="160" height="238" rx="9" fill="#b4aed3" stroke-width="5"/>
      <rect x="217" y="137" width="160" height="238" rx="9" fill="url(#hatch)" stroke="none"/>
      <path transform="translate(297 252) scale(4)" fill="#4f3f9a" stroke-width="1.3" d="M0-12C3.5-7 12-3 12 2.5 12 6.5 9 8.6 6 8.6 4.3 8.6 2.8 7.8 1.8 6.6 2 9 3.2 10.8 5 12H-5C-3.2 10.8-2 9-1.8 6.6-2.8 7.8-4.3 8.6-6 8.6-9 8.6-12 6.5-12 2.5-12-3-3.5-7 0-12Z"/>
    </g>
    </g>
    <!-- a health potion in front -->
    <g transform="translate(392 392) scale(0.8)">
      <path d="M-20-58H20V-44H-20Z" fill="#8a5a32" stroke-width="7"/>
      <path d="M-14-44H14V-24C40-14 52 6 52 26 52 58 28 78 0 78-28 78-52 58-52 26-52 6-40-14-14-24Z" fill="#f3e7cb" stroke-width="8"/>
      <path d="M-46 32C-41 55-22 71 0 71 22 71 41 55 46 32 20 40-20 24-46 32Z" fill="#bf3328" stroke="none"/>
      <path d="M-14-44H14V-24C40-14 52 6 52 26 52 58 28 78 0 78-28 78-52 58-52 26-52 6-40-14-14-24Z" fill="none" stroke-width="8"/>
      <path d="M-30 4C-26-6-18-12-10-14" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7"/>
    </g>
  </g>
</svg>
